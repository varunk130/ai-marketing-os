<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="AI Marketing OS — An AI team for every marketing function">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1422"/>
      <stop offset="55%" stop-color="#0c0c14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>

    <!-- Brand gradient for title -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Subtle glow gradients -->
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#2f2f38" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>

    <!-- Agent circle gradient (glassy) -->
    <radialGradient id="orbShine" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Connector line gradient -->
    <linearGradient id="connector" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42424d" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#5a5a66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#42424d" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- Ambient glows -->
  <circle cx="200" cy="180" r="280" fill="url(#glowL)"/>
  <circle cx="1080" cy="460" r="320" fill="url(#glowR)"/>

  <!-- Eyebrow pill -->
  <g transform="translate(640,128)">
    <rect x="-118" y="-18" width="236" height="36" rx="18" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
    <circle cx="-92" cy="0" r="3.5" fill="#a78bfa"/>
    <text x="-80" y="5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#c4b5fd" font-weight="600">THE AI MARKETING OS</text>
  </g>

  <!-- Title -->
  <text x="640" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="700" letter-spacing="-2.5" fill="url(#brand)">AI Marketing OS</text>

  <!-- Subtitle -->
  <text x="640" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#dcdce4" font-weight="400">An AI team for every marketing function.</text>

  <!-- Stat row -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#b8b8c4">
    <text x="430" y="358" text-anchor="end">9 specialist agents</text>
    <circle cx="455" cy="354" r="2.5" fill="#5a5a66"/>
    <text x="480" y="358">12 expert skills</text>
    <circle cx="650" cy="354" r="2.5" fill="#5a5a66"/>
    <text x="675" y="358">4-layer architecture</text>
    <circle cx="868" cy="354" r="2.5" fill="#5a5a66"/>
    <text x="893" y="358">end-to-end artifacts</text>
  </g>

  <!-- Agent constellation -->
  <!-- Center y for orbs -->
  <g transform="translate(640,485)">
    <!-- Connector lines between adjacent orbs (faint) -->
    <g stroke="url(#connector)" stroke-width="1.5" stroke-linecap="round">
      <line x1="-440" y1="0" x2="-330" y2="0"/>
      <line x1="-330" y1="0" x2="-220" y2="0"/>
      <line x1="-220" y1="0" x2="-110" y2="0"/>
      <line x1="-110" y1="0" x2="0"    y2="0"/>
      <line x1="0"    y1="0" x2="110"  y2="0"/>
      <line x1="110"  y1="0" x2="220"  y2="0"/>
      <line x1="220"  y1="0" x2="330"  y2="0"/>
      <line x1="330"  y1="0" x2="440"  y2="0"/>
    </g>

    <!-- Curved orchestration arcs (subtle) -->
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1.25">
      <path d="M -440,-2 Q -220,-95 0,-2"/>
      <path d="M 0,-2 Q 220,-95 440,-2"/>
    </g>
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.25">
      <path d="M -330,2 Q -110,90 110,2"/>
      <path d="M 110,2 Q 330,90 440,2"/>
    </g>

    <!-- 9 agent orbs. ordering: Atlas Echo Nova Lens Forge Scout Anvil Oracle Ledger -->
    <!-- Atlas - blue -->
    <g transform="translate(-440,0)">
      <circle r="38" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#bfdbfe">AT</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Atlas</text>
    </g>
    <!-- Echo - emerald -->
    <g transform="translate(-330,0)">
      <circle r="38" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a7f3d0">EC</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Echo</text>
    </g>
    <!-- Nova - violet -->
    <g transform="translate(-220,0)">
      <circle r="38" fill="#a78bfa" fill-opacity="0.20" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#ddd6fe">NV</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Nova</text>
    </g>
    <!-- Lens - amber -->
    <g transform="translate(-110,0)">
      <circle r="38" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#fde68a">LN</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Lens</text>
    </g>
    <!-- Forge - rose -->
    <g transform="translate(0,0)">
      <circle r="40" fill="#fb7185" fill-opacity="0.20" stroke="#fb7185" stroke-opacity="0.65" stroke-width="1.6"/>
      <circle r="40" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#fecdd3">FG</text>
      <text y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Forge</text>
    </g>
    <!-- Scout - cyan -->
    <g transform="translate(110,0)">
      <circle r="38" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a5f3fc">SC</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Scout</text>
    </g>
    <!-- Anvil - indigo -->
    <g transform="translate(220,0)">
      <circle r="38" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#c7d2fe">AN</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Anvil</text>
    </g>
    <!-- Oracle - fuchsia -->
    <g transform="translate(330,0)">
      <circle r="38" fill="#e879f9" fill-opacity="0.18" stroke="#e879f9" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#f5d0fe">OR</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Oracle</text>
    </g>
    <!-- Ledger - emerald (alt) -->
    <g transform="translate(440,0)">
      <circle r="38" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
      <circle r="38" fill="url(#orbShine)"/>
      <text y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a7f3d0">LD</text>
      <text y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#dcdce4">Ledger</text>
    </g>
  </g>

  <!-- Footer caption -->
  <text x="640" y="612" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" letter-spacing="2.5" fill="#8e8e9a">SKILLS · AGENTS · ORCHESTRATION · ARTIFACTS</text>
</svg>
